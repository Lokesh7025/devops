<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submission Result</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h2 { color: #28a745; }
        .data-row { margin-bottom: 10px; }
        .label { font-weight: bold; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Thank You!</h2>
    <p>Your submission was successful. Here is what we received:</p>
    
    <div class="data-row">
        <span class="label">Name:</span>
        <span th:text="${submission.name}"></span>
    </div>
    
    <div class="data-row">
        <span class="label">Email:</span>
        <span th:text="${submission.email}"></span>
    </div>
    
    <div class="data-row">
        <span class="label">Message:</span>
        <span th:text="${submission.message}"></span>
    </div>
    
    <a th:href="@{/}">&larr; Back to Form</a>
</body>
</html>
